name: Validate & Sync

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    name: TypeScript + Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript check
        run: yarn tsc --noEmit

      - name: Lint (skip gracefully if script missing)
        run: yarn lint || true

  notify-sync:
    name: Mark as synced
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      statuses: write
    steps:
      - name: Post commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: 'Validated and synced',
              context: 'ci/sync'
            });
