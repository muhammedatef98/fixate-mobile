name: PR Safety Check

on:
  pull_request:
    branches: [main, master]

jobs:
  android-ios-guard:
    name: Android/iOS conflict check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Android+iOS co-changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const androidFiles = [
              'lib/notifications.ts',
              'app/_layout.tsx',
              'app.json',
            ];

            const changedPaths = files.map(f => f.filename);
            const touchesAndroid = androidFiles.some(f => changedPaths.includes(f));
            const touchesIOS = changedPaths.some(f => f.startsWith('ios/'));

            if (touchesAndroid && touchesIOS) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: '⚠️ **Warning:** This PR modifies both Android-specific files and `ios/` files.\n\nPlease confirm this is intentional — Android push notification fixes should never touch iOS files.',
              });
            }
