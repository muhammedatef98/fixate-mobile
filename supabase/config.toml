project_id = "gpucisjxecupcyosumgy"

# ── Auth ──────────────────────────────────────────────────────────────
# These values are pushed to the hosted project via `supabase config push`,
# so every field here must hold the real production value — omitted fields
# get overwritten with CLI defaults on push.
#
# KNOWN CLI BUG (`supabase config push`, CLI 2.108.x):
#   fails with `failed to read Storage config: SchemaError(Missing key at
#   ["databasePoolMode"])`. Cause: `config push` reads the WHOLE remote config
#   (all sections) to build its diff, and the Management API's Storage-config
#   response omits a key the CLI's schema marks required — a client/server
#   version skew that aborts the push even when only [auth] changed.
# WORKAROUND (auth-only, never touches Storage config): PATCH the auth config
#   directly via the Management API —
#     TOKEN=$(security find-generic-password -s "Supabase CLI" -a supabase -w)
#     curl -X PATCH \
#       -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
#       https://api.supabase.com/v1/projects/gpucisjxecupcyosumgy/config/auth \
#       -d '{"site_url":"https://fixate.site","uri_allow_list":"<comma,sep,list>"}'
#   The uri_allow_list is the comma-joined `additional_redirect_urls` below.
[auth]
site_url = "https://fixate.site"
# GitHub Pages host for the email-change confirmation page. The repo was
# renamed fixatee-mobile → fixate-mobile; Pages URLs do not redirect, so
# these must always use the current repo name.
# The app's registered native URL scheme is `fixatee` (native id
# com.fixatee.app — permanent; "fixate" is only the brand name). Deep links
# MUST use fixatee:// or no installed build will open. The legacy fixate://
# entries are kept so any link already in flight still validates, but the app
# and the hosted landing page both emit fixatee://auth/callback now.
additional_redirect_urls = [
  "fixatee://auth/callback",
  "fixatee://**",
  "fixate://auth/callback",
  "fixate://**",
  "https://fixate.site/**",
  "https://muhammedatef98.github.io/fixate-mobile/email-change-confirmation.html",
  "https://muhammedatef98.github.io/fixate-mobile/**",
]
# 7 days — mobile sessions should not force hourly refreshes.
jwt_expiry = 604800

# CAPTCHA must stay OFF: the mobile app calls signInWithPassword without a
# captcha token, so enabling this in the dashboard blocks every mobile login.
[auth.captcha]
enabled = false

# ── Anonymous functions ───────────────────────────────────────────────
# These MUST be reachable before the caller has a session — OTP send/verify,
# the auto-confirming signup helper, and the static legal pages required by
# Apple/Google for account-deletion and privacy disclosure.

[functions.verify-phone-otp]
verify_jwt = false

[functions.send-phone-otp]
verify_jwt = false

[functions.send-otp]
verify_jwt = false

[functions.verify-otp]
verify_jwt = false

[functions.signup]
verify_jwt = false

[functions.legal-privacy]
verify_jwt = false

[functions.legal-delete-account]
verify_jwt = false

# ── Authenticated functions ───────────────────────────────────────────
# Supabase's default is verify_jwt = true, but we set it explicitly so a
# future config edit can't accidentally open these to anonymous callers.
# Each of these reads `req.headers.get('Authorization')` and rejects on
# a missing/invalid token.

[functions.delete-account]
verify_jwt = true

[functions.create-paypal-order]
verify_jwt = true

[functions.capture-paypal-order]
verify_jwt = true
